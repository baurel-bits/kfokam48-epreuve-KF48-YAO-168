server:
  port: 8088

spring:
  application:
    name: kfokam48-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/exam_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    # B5 : aucune mise à jour automatique du schéma, le schéma vient de Flyway.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Un schéma préexistant non vide (outil externe, ancienne version du projet)
    # fait échouer Flyway faute d'historique. `baseline-version: 0` est essentiel :
    # avec la valeur par défaut (1), V1 serait considérée comme déjà appliquée et le
    # schéma ne serait jamais créé. Sur un schéma vide, ces réglages sont sans effet.
    baseline-on-migrate: true
    baseline-version: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  # Paramètres issus du cahier des charges
  session:
    code-validity-minutes: 15   # RG1 : le code expire 15 minutes après l'ouverture
  presence:
    max-echecs: 5               # RG3 : blocage après 5 échecs de saisie
    blocage-minutes: 2          # RG3 : durée du blocage

logging:
  level:
    com.kfokam48: INFO
    org.flywaydb: INFO
