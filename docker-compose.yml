services:
  postgres:
    image: postgres:17-alpine
    container_name: exam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-exam_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-exam_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Décommenter si vous souhaitez conteneuriser le serveur SMTP de test (MailHog)
  # mailhog:
  #   image: mailhog/mailhog:latest
  #   container_name: exam-mailhog
  #   ports:
  #     - "1025:1025" # SMTP
  #     - "8025:8025" # UI web

  # Emplacements prévus pour backend et frontend si conteneurisation demandée plus tard
  # backend:
  #   build: ./backend
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   ports:
  #     - "8080:8080"

  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "3000:3000"

volumes:
  postgres_data:
    driver: local
